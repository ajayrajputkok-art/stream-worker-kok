name: Render and Release CH2 Video

on:
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Action execution mode'
        required: false
        default: 'Full Render & Stream'
      current_week:
        description: 'Current week jodis'
        required: true
        default: '54,78'
      trick_1_id:
        description: 'Match ID for Trick 1'
        required: true
        default: '0'
      trick_2_id:
        description: 'Match ID for Trick 2'
        required: false
        default: ''
      quality:
        description: 'Render quality'
        required: true
        default: 'LOW'
        type: choice
        options:
          - LOW
          - 4K
      pace:
        description: 'Pace multiplier'
        required: true
        default: '3.5'
      num_weeks:
        description: 'Number of recent weeks'
        required: false
        default: '6'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Private Engine Code
        run: |
          git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/ajayrajputkok-art/KOKStream.git .
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl numpy requests

      - name: Install System Dependencies & Hindi Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libpango1.0-dev libcairo2-dev pkg-config fonts-noto-core fonts-indic

      - name: Install Video Dependencies
        run: |
          pip install manim edge-tts

      - name: Run CH2 Video Engine
        run: python kok_render.py --current-week "${{ github.event.inputs.current_week }}" --t1 "${{ github.event.inputs.trick_1_id }}" --t2 "${{ github.event.inputs.trick_2_id }}" --quality "${{ github.event.inputs.quality }}" --pace "${{ github.event.inputs.pace }}" --num-weeks "${{ github.event.inputs.num_weeks }}"

      - name: Remux Broadcast Master MOV (12Mbps CBR + PCM Audio)
        run: |
          ffmpeg -y -i output/ch2_master_video.mp4 \
            -c:v libx264 -preset fast -profile:v main \
            -b:v 12000k -minrate 12000k -maxrate 12000k -bufsize 12000k \
            -x264-params "nal-hrd=cbr:force-cfr=1" \
            -bf 1 -pix_fmt yuv420p \
            -c:a pcm_s24le -ar 48000 \
            -timecode "01:00:00:00" \
            output/kalyan_master_video_ch2.mov

      - name: Publish CH2 Video to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest-ch2
          name: Latest CH2 Stream Video
          files: output/kalyan_master_video_ch2.mov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
