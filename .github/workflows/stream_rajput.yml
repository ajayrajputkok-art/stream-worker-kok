name: Stream Rajput to YouTube RTMP

on:
  workflow_dispatch:
    inputs:
      stream_mode:
        description: 'Choose Streaming Duration'
        required: true
        default: 'Until Manually Stopped (Continuous Loop)'
        type: choice
        options:
          - 'Until Manually Stopped (Continuous Loop)'
          - 'Single Timed Stream (~40 mins)'

concurrency:
  group: stream-rajput-active
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      - name: Install System FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Download Latest Master Video from Private Release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          SLUG="${{ secrets.CORE_REPO_SLUG }}"
          if [ -z "$SLUG" ]; then SLUG="ajayrajputkok-art/KOKStream"; fi
          echo "Downloading latest Rajput video from $SLUG..."
          gh release download latest --repo "$SLUG" -p "kalyan_master_video.mp4" --output stream_video.mp4 --clobber

      - name: Prepare Live-Safe Stream Video
        run: |
          # One-time offline conversion (not real-time): 1080p30, steady 6000k bitrate,
          # keyframe every 2s, audio/video lengths matched. Makes the copy-stream below safe for YouTube.
          ffmpeg -y -i stream_video.mp4 \
            -vf "scale=1920:1080:flags=lanczos,fps=30,format=yuv420p" \
            -c:v libx264 -preset veryfast -profile:v high \
            -b:v 6000k -maxrate 6000k -bufsize 12000k \
            -x264-params nal-hrd=cbr \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -af apad -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -shortest -movflags +faststart \
            stream_ready.mp4
          mv stream_ready.mp4 stream_video.mp4

      - name: Stream Indefinitely to YouTube RTMP
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          MODE: ${{ github.event.inputs.stream_mode }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "::error::Secret YOUTUBE_STREAM_KEY is not set!"
            exit 1
          fi

          trap 'echo "Workflow cancelled by user. Terminating stream immediately..."; exit 130' INT TERM

          if [[ "$MODE" == *"Until Manually Stopped"* ]]; then
            DURATION=19800
            echo "Mode: MANUAL STOP (Continuous Loop, 5.5h runner chunk)..."
          else
            DURATION=$((2400 + RANDOM % 121))
            echo "Mode: TIMED (${DURATION}s / ~$(( DURATION / 60 )) mins)..."
          fi

          # Generate a repeating playlist. Concat demuxer automatically recalculates 
          # timestamps across loops without re-encoding or resetting PTS to zero!
          > playlist.txt
          for i in {1..200}; do
            echo "file 'stream_video.mp4'" >> playlist.txt
          done

          START_TIME=$(date +%s)
          END_TIME=$(( START_TIME + DURATION ))

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 5 ]; then
              break
            fi

            echo ">> Streaming via lightweight copy pipeline ($REMAINING seconds remaining)..."

            # 0% CPU - No filters, no re-encoding, speed pinned at 1.00x, drop=0
            : > /tmp/ff_progress.txt
            ffmpeg -re -f concat -safe 0 -i playlist.txt \
              -t "$REMAINING" \
              -c copy \
              -flvflags no_duration_filesize \
              -progress /tmp/ff_progress.txt -stats_period 5 \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" &
            FF_PID=$!

            # Watchdog: if ffmpeg freezes (output size stops growing) but never exits,
            # kill it so the loop below reconnects to YouTube.
            LAST_SIZE=""
            STALL=0
            while kill -0 "$FF_PID" 2>/dev/null; do
              sleep 10
              CUR_SIZE=$(grep '^total_size=' /tmp/ff_progress.txt | tail -1 | cut -d= -f2)
              if [ "$CUR_SIZE" = "$LAST_SIZE" ]; then
                STALL=$((STALL + 1))
              else
                STALL=0
              fi
              LAST_SIZE="$CUR_SIZE"
              if [ $STALL -ge 2 ]; then
                echo ">> No data sent to YouTube for ~20s. Restarting ffmpeg..."
                kill -9 "$FF_PID" 2>/dev/null || true
                break
              fi
            done
            wait "$FF_PID" 2>/dev/null || true

            if [ $? -eq 130 ]; then
              break
            fi

            echo ">> Stream interrupted/reconnecting in 2 seconds..."
            sleep 2
          done

          if [ $(date +%s) -ge $END_TIME ]; then
            touch /tmp/stream_chunk_completed_normally
          fi

      - name: Trigger Next Relay Runner (Manual Stop Mode Only)
        if: success() && github.event.inputs.stream_mode == 'Until Manually Stopped (Continuous Loop)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/stream_chunk_completed_normally ]; then
            echo "Chunk finished normally. Triggering next relay runner to maintain 24/7 stream..."
            gh workflow run stream_rajput.yml \
              --repo "${{ github.repository }}" \
              -f "stream_mode=Until Manually Stopped (Continuous Loop)"
          else
            echo "Stream was stopped prematurely or cancelled. Skipping relay runner dispatch."
          fi
