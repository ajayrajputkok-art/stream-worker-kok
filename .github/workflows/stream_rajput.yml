name: Stream Rajput to YouTube RTMP

on:
  workflow_dispatch:
    inputs:
      stream_mode:
        description: 'Choose Streaming Duration'
        required: true
        default: 'Until Manually Stopped (Continuous Loop)'
        type: choice
        options:
          - 'Until Manually Stopped (Continuous Loop)'
          - 'Single Timed Stream (~40 mins)'

concurrency:
  group: stream-rajput-active
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      - name: Install System FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Download Latest Master Video from Private Release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          SLUG="${{ secrets.CORE_REPO_SLUG }}"
          if [ -z "$SLUG" ]; then SLUG="ajayrajputkok-art/KOKStream"; fi
          echo "Downloading latest Rajput video from $SLUG..."
          gh release download latest --repo "$SLUG" -p "kalyan_master_video.mov" --output stream_video.mov --clobber

      - name: Stream Indefinitely to YouTube RTMP
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          MODE: ${{ github.event.inputs.stream_mode }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "::error::Secret YOUTUBE_STREAM_KEY is not set!"
            exit 1
          fi

          if [[ "$MODE" == *"Until Manually Stopped"* ]]; then
            # 5 hours 30 minutes (19800s) runner chunk for safe relay before 6h timeout
            DURATION=19800
            echo "Mode: MANUAL STOP (Continuous Loop, 5.5h runner chunk)..."
          else
            # ~40-42 minutes single broadcast
            DURATION=$((2400 + RANDOM % 121))
            echo "Mode: TIMED (${DURATION}s / ~$(( DURATION / 60 )) mins)..."
          fi

          START_TIME=$(date +%s)
          END_TIME=$(( START_TIME + DURATION ))

          # Resilient loop: If YouTube disconnects or throws Broken pipe, reconnect immediately
          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 5 ]; then
              break
            fi

            echo ">> Starting/Resuming stream ($REMAINING seconds remaining in this runner)..."

            ffmpeg -re -stream_loop -1 -fflags +genpts -i stream_video.mov \
              -t "$REMAINING" \
              -c:v copy \
              -c:a aac -b:a 192k -ar 48000 \
              -max_muxing_queue_size 4096 \
              -flvflags no_duration_filesize+flush_packets \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" || true

            echo ">> Connection dropped or finished. Waiting 3 seconds before reconnect check..."
            sleep 3
          done

      - name: Trigger Next Relay Runner (Manual Stop Mode Only)
        if: always() && contains(github.event.inputs.stream_mode, 'Until Manually Stopped')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next relay runner to maintain 24/7 continuous stream..."
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            -f "stream_mode=Until Manually Stopped (Continuous Loop)"
