name: Render and Release CH2 Video

on:
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Action execution mode'
        required: true
        default: 'Full Render & Stream'
        type: choice
        options:
          - 'Full Render & Stream'
          - 'Dry Run (Inspect Patterns Only)'
      current_week:
        description: 'Current week jodis (leave empty for Monday)'
        required: false
        default: ''
      tricks:
        description: 'Match IDs for Tricks (e.g. 0,1,2 or single 0)'
        required: false
        default: '0'
      quality:
        description: 'Render quality'
        required: true
        default: 'LOW'
        type: choice
        options:
          - LOW
          - 4K
      pace:
        description: 'Pace multiplier'
        required: true
        default: '1.0'
      num_weeks:
        description: 'Number of block weeks (6 historical + 1 current = 7)'
        required: false
        default: '7'
      product_title:
        description: 'Affiliate Product Title (leave empty to skip promo)'
        required: false
        default: ''
      product_image_url:
        description: 'Product Image Direct URL (PNG/JPG, leave empty to use local product.png)'
        required: false
        default: ''
      product_voiceover:
        description: 'Custom Hindi Pitch for Product'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out public repo
        uses: actions/checkout@v4

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libpango1.0-dev libcairo2-dev pkg-config fonts-noto-core fonts-indic curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch KOK Code & Assets from Private Core
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.PRIVATE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SLUG="${{ secrets.CORE_REPO_SLUG }}"
          if [ -z "$SLUG" ]; then SLUG="ajayrajputkok-art/KOKStream"; fi
          echo "Cloning core scripts and assets from $SLUG..."
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SLUG}.git" temp_core
          cp temp_core/kok_render.py ./ || true
          cp temp_core/*Kalyan*.xlsx ./ || true
          cp temp_core/bg_music*.mp3 ./ || true
          cp temp_core/sfx_draw*.mp3 ./ || true
          cp temp_core/product.png ./ || true
          rm -rf temp_core

      - name: Download Product Image if URL Provided
        run: |
          IMG_URL="${{ github.event.inputs.product_image_url }}"
          if [ -n "$IMG_URL" ]; then
            echo "Downloading product image from $IMG_URL..."
            curl -L -s "$IMG_URL" -o product.png
          fi

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl numpy requests manim edge-tts

      - name: Run KOK Video Engine
        run: |
          CURRENT_WEEK_ARG="${{ github.event.inputs.current_week }}"
          
          if [ "${{ github.event.inputs.action_mode }}" = "Dry Run (Inspect Patterns Only)" ]; then
            echo "Running Dry-Run to inspect pattern matches..."
            python kok_render.py \
              --current-week "$CURRENT_WEEK_ARG" \
              --num-weeks "${{ github.event.inputs.num_weeks }}" \
              --dry-run
          else
            echo "Running Full Video Generation..."
            python kok_render.py \
              --current-week "$CURRENT_WEEK_ARG" \
              --tricks "${{ github.event.inputs.tricks }}" \
              --quality "${{ github.event.inputs.quality }}" \
              --pace "${{ github.event.inputs.pace }}" \
              --num-weeks "${{ github.event.inputs.num_weeks }}" \
              --product-title "${{ github.event.inputs.product_title }}" \
              --product-voice "${{ github.event.inputs.product_voiceover }}"
          fi

      - name: Publish Video to Release
        if: github.event.inputs.action_mode != 'Dry Run (Inspect Patterns Only)'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ch2
          name: Latest CH2 Stream Video
          files: |
            output/ch2_master_video.mp4
            output/kalyan_master_video_ch2_1080p.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
