name: Render and Release CH2 Video

on:
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Action execution mode'
        required: true
        default: 'Full Render & Stream'
        type: choice
        options:
          - 'Full Render & Stream'
          - 'Dry Run (Inspect Patterns Only)'
      current_week:
        description: 'Current week jodis (leave empty for Monday)'
        required: false
        default: ''
      trick_1_id:
        description: 'Match ID for Trick 1'
        required: false
        default: '0'
      trick_2_id:
        description: 'Match ID for Trick 2'
        required: false
        default: ''
      quality:
        description: 'Render quality'
        required: true
        default: 'LOW'
        type: choice
        options:
          - LOW
          - 4K
      pace:
        description: 'Pace multiplier'
        required: true
        default: '3.5'
      num_weeks:
        description: 'Number of recent weeks'
        required: false
        default: '6'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out public repo
        uses: actions/checkout@v4

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libpango1.0-dev libcairo2-dev pkg-config fonts-noto-core fonts-indic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch CH2 Code & Assets from Private Core
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          SLUG="${{ secrets.CORE_REPO_SLUG }}"
          if [ -z "$SLUG" ]; then SLUG="ajayrajputkok-art/KOKStream"; fi
          echo "Cloning core scripts and assets from $SLUG..."
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SLUG}.git" temp_core

          cp temp_core/kok_render.py ./ || true
          cp temp_core/*Kalyan*.xlsx ./ || true
          cp temp_core/bg_music*.mp3 ./ || true
          cp temp_core/sfx_draw*.mp3 ./ || true
          cp temp_core/audio_cta*.mp3 ./ || true
          rm -rf temp_core

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl numpy requests manim edge-tts

      - name: Run CH2 Video Engine
        run: |
          CURRENT_WEEK_ARG="${{ github.event.inputs.current_week }}"

          if [ "${{ github.event.inputs.action_mode }}" = "Dry Run (Inspect Patterns Only)" ]; then
            echo "Running Dry-Run to inspect pattern matches..."
            python kok_render.py \
              --current-week "$CURRENT_WEEK_ARG" \
              --num-weeks "${{ github.event.inputs.num_weeks }}" \
              --dry-run
          else
            echo "Running Full Video Generation..."
            python kok_render.py \
              --current-week "$CURRENT_WEEK_ARG" \
              --t1 "${{ github.event.inputs.trick_1_id }}" \
              --t2 "${{ github.event.inputs.trick_2_id }}" \
              --quality "${{ github.event.inputs.quality }}" \
              --pace "${{ github.event.inputs.pace }}" \
              --num-weeks "${{ github.event.inputs.num_weeks }}"
          fi

      - name: Remux Broadcast Master MOV (12Mbps CBR + FastStart)
        if: github.event.inputs.action_mode != 'Dry Run (Inspect Patterns Only)'
        run: |
          SRC_FILE=$(find . -maxdepth 3 -type f -name "ch2_master_video.mp4" -o -name "*master*.mp4" | head -n 1)
          if [ -z "$SRC_FILE" ]; then SRC_FILE="output/ch2_master_video.mp4"; fi

          if [ -f "$SRC_FILE" ]; then
            mkdir -p output
            ffmpeg -y -i "$SRC_FILE" \
              -c:v libx264 -preset fast -profile:v main \
              -b:v 12000k -minrate 12000k -maxrate 12000k -bufsize 12000k \
              -x264-params "nal-hrd=cbr:force-cfr=1" \
              -bf 1 -pix_fmt yuv420p \
              -c:a aac -b:a 320k -ar 48000 \
              -timecode "01:00:00:00" \
              -movflags +faststart \
              output/kalyan_master_video_ch2.mov
          else
            echo "::error::Source video MP4 not found!"
            exit 1
          fi

      - name: Publish Video to Private Repo Releases
        if: github.event.inputs.action_mode != 'Dry Run (Inspect Patterns Only)'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          SLUG="${{ secrets.CORE_REPO_SLUG }}"
          if [ -z "$SLUG" ]; then SLUG="ajayrajputkok-art/KOKStream"; fi
          gh release upload latest-ch2 output/kalyan_master_video_ch2.mov --repo "$SLUG" --clobber
