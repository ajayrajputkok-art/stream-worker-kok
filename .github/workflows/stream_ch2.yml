name: Stream CH2 to YouTube RTMP

on:
  workflow_dispatch:
    inputs:
      stream_mode:
        description: 'Choose Streaming Duration'
        required: true
        default: 'Single Timed Stream (~40 mins)'
        type: choice
        options:
          - 'Single Timed Stream (~40 mins)'
          - 'Until Manually Stopped (Continuous Loop)'

concurrency:
  group: stream-ch2-active
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      - name: Install System FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Download Latest CH2 Video from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading kalyan_master_video_ch2.mov from release latest-ch2..."
          gh release download latest-ch2 \
            --pattern "kalyan_master_video_ch2.mov" \
            --clobber

          mv kalyan_master_video_ch2.mov stream_video_ch2.mov

          FILE_SIZE=$(stat -c%s "stream_video_ch2.mov" 2>/dev/null || stat -f%z "stream_video_ch2.mov")
          echo "Downloaded file size: $(( FILE_SIZE / 1024 / 1024 )) MB"

          if [ "$FILE_SIZE" -lt 10485760 ]; then
            echo "::error::Downloaded file is too small or invalid ($FILE_SIZE bytes)."
            head -n 20 stream_video_ch2.mov
            exit 1
          fi

      - name: Verify Video Metadata
        run: |
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_name,codec_type,width,height,bit_rate \
            stream_video_ch2.mov

      - name: Stream to YouTube RTMP
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY_CH2 }}
          MODE: ${{ github.event.inputs.stream_mode }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "::error::Secret YOUTUBE_STREAM_KEY_CH2 is not set!"
            exit 1
          fi

          if [[ "$MODE" == *"Until Manually Stopped"* ]]; then
            # 5.5 hours (19800s) runner chunk for safe relay handoff
            DURATION=19800
            echo "Mode: MANUAL STOP (Continuous Loop, 5.5h runner chunk)..."
          else
            # ~40-42 minutes single broadcast
            DURATION=$((2400 + RANDOM % 121))
            echo "Mode: TIMED (${DURATION}s / ~$(( DURATION / 60 )) mins)..."
          fi

          ffmpeg -re -stream_loop -1 -fflags +genpts -i stream_video_ch2.mov \
            -t "$DURATION" \
            -c:v copy \
            -c:a aac -b:a 320k -ar 48000 \
            -flvflags no_duration_filesize \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      - name: Trigger Next Relay Runner (Manual Stop Mode Only)
        if: always() && contains(github.event.inputs.stream_mode, 'Until Manually Stopped')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next relay runner to maintain 24/7 continuous stream..."
          gh workflow run "Stream CH2 to YouTube RTMP" -f "stream_mode=Until Manually Stopped (Continuous Loop)"
